name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Next.js validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npm run e2e:install

      - name: E2E tests
        run: npm run e2e

      - name: Production build
        run: npm run build

      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high
